<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Acessível</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 22px; /* Tamanho de fonte ampliado */
      line-height: 1.6;
      margin: 40px;
      background-color: #ffffff;
      color: #111111; /* Alto contraste */
    }

    .btn-audio {
      font-size: 20px;
      padding: 14px 28px;
      background-color: #0056b3;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .btn-audio:hover {
      background-color: #003d80;
    }
  </style>
</head>
<body>

  <!-- Botão para acionar a leitura -->
  <button class="btn-audio" onclick="lerTexto()">🔊 Ouvir Página</button>

  <!-- Conteúdo lido pelo script -->
  <main id="conteudo-principal">
    <h1>Bem-vindo ao Portal</h1>
    <p>Este site foi desenvolvido para facilitar a sua leitura. Caso prefira escutar, basta clicar no botão de áudio acima a qualquer momento.</p>
  </main>

  <script>
    function lerTexto() {
      // Captura todo o texto da área principal
      const texto = document.getElementById('conteudo-principal').innerText;

      // Interrompe leituras anteriores em andamento
      window.speechSynthesis.cancel();

      // Configura a leitura em português
      const mensagem = new SpeechSynthesisUtterance(texto);
      mensagem.lang = 'pt-BR';
      mensagem.rate = 0.9; // Velocidade levemente reduzida para maior clareza

      // Inicia a reprodução de áudio
      window.speechSynthesis.speak(mensagem);
    }
  </script>

</body>
</html>
